version: '3'

vars:
  GO: '{{.GO | default "go"}}'
  GOVULNCHECK_VERSION: v1.7.0
  AWS_REGION: us-west-2
  FOUNDRY_URL: https://foundry.craigdevjohnson.com
  # The host is found by its tags, so a rebuild needs no change here. The AWS
  # CLI takes credentials from the environment, for example
  # AWS_PROFILE=workloads-admin locally or the OIDC role in GitHub Actions.
  FIND_HOST: >-
    aws ec2 describe-instances --region {{.AWS_REGION}}
    --filters Name=tag:Name,Values=foundry Name=tag:project,Values=foundry
    Name=instance-state-name,Values=pending,running,stopping,stopped
    --query 'Reservations[].Instances[].InstanceId' --output text

tasks:
  default:
    desc: Run the CI checks
    cmds:
      - task: ci

  ci:
    desc: Check formatting, vet, test, build the Lambda artifact and scan it
    cmds:
      - task: fmt-check
      - task: vet
      - task: test
      - task: vuln

  fmt:
    desc: Format Go sources
    cmds:
      - '{{.GO}} fmt ./...'

  fmt-check:
    desc: Fail when Go sources need formatting
    cmds:
      - cmd: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
        silent: true

  vet:
    desc: Run go vet
    cmds:
      - '{{.GO}} vet ./...'

  test:
    desc: Run tests with the race detector
    cmds:
      - '{{.GO}} test -race ./...'

  build:
    desc: Build the Linux ARM64 Lambda bootstrap and its zip in dist/
    cmds:
      - mkdir -p dist
      - "CGO_ENABLED=0 GOOS=linux GOARCH=arm64 {{.GO}} build -tags lambda.norpc -trimpath -buildvcs=false -ldflags='-s -w' -o dist/bootstrap ./cmd/lambda"
      # The same source gives the same zip, so a plan with no code change
      # reports no change to the controller (infra/controller.tf hashes the
      # zip): the binary carries no build path or commit (-trimpath,
      # -buildvcs=false), and the archive carries a fixed mode and time and no
      # extra fields (-X) instead of this build's.
      - cd dist && chmod 0755 bootstrap && TZ=UTC touch -t 198001010000 bootstrap && rm -f bootstrap.zip && TZ=UTC zip -q -X bootstrap.zip bootstrap

  run:
    desc: Serve the controller at http://127.0.0.1:8083 with your AWS read credentials
    summary: |
      Serve the controller's HTTP interface (docs/status-api.md) on this
      computer, to ask it directly with curl:

        AWS_PROFILE=workloads-readonly task run

      It reads the host with the credentials in the environment; only its
      POST /server/start and /server/stop change anything, and the read-only
      profile can't. FOUNDRY_AWS_REGION, FOUNDRY_INSTANCE_ID and FOUNDRY_HTTPS_URL
      default to us-west-2, the host found by its tags (as host:status finds
      it) and the join page; set any of them to override it. FOUNDRY_ADDR
      changes the address, which must be a loopback address.
    cmds:
      - |
        FOUNDRY_AWS_REGION="${FOUNDRY_AWS_REGION:-{{.AWS_REGION}}}" \
        FOUNDRY_HTTPS_URL="${FOUNDRY_HTTPS_URL:-{{.FOUNDRY_URL}}/join}" \
        FOUNDRY_INSTANCE_ID="${FOUNDRY_INSTANCE_ID:-$({{.FIND_HOST}})}" \
        {{.GO}} run ./cmd/lambda

  vuln:
    desc: Scan the Lambda binary with govulncheck
    deps: [build]
    cmds:
      - '{{.GO}} run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} -mode=binary dist/bootstrap'

  host:status:
    desc: Show the host's state and whether Foundry answers
    vars: &host-vars
      INSTANCE_ID:
        sh: '{{.FIND_HOST}}'
      HOST_STATE:
        sh: >-
          aws ec2 describe-instances --region {{.AWS_REGION}} --instance-ids {{.INSTANCE_ID}}
          --query 'Reservations[0].Instances[0].State.Name' --output text
    preconditions: &one-host
      - sh: test "$(echo '{{.INSTANCE_ID}}' | wc -w)" -eq 1
        msg: 'Expected exactly one host tagged Name=foundry and project=foundry, found "{{.INSTANCE_ID}}"'
    cmds:
      - echo 'Host {{.INSTANCE_ID}} is {{.HOST_STATE}}'
      - cmd: |
          if [ '{{.HOST_STATE}}' = running ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 '{{.FOUNDRY_URL}}/' || true)
            echo "Foundry at {{.FOUNDRY_URL}} answered HTTP ${code:-none}"
          fi
        silent: true

  host:start:
    desc: Start the host and wait until Foundry answers
    vars: *host-vars
    preconditions: *one-host
    cmds:
      # A running host still gets the readiness check: Foundry may be down.
      # StartInstances needs a stopped host, so a host mid-start or mid-stop is
      # waited out first.
      - cmd: |
          case '{{.HOST_STATE}}' in
            running | pending) ;;
            stopping)
              aws ec2 wait instance-stopped --region {{.AWS_REGION}} --instance-ids {{.INSTANCE_ID}} || exit 1
              aws ec2 start-instances --region {{.AWS_REGION}} --instance-ids {{.INSTANCE_ID}} --output text || exit 1
              ;;
            *)
              aws ec2 start-instances --region {{.AWS_REGION}} --instance-ids {{.INSTANCE_ID}} --output text || exit 1
              ;;
          esac
          aws ec2 wait instance-running --region {{.AWS_REGION}} --instance-ids {{.INSTANCE_ID}} || exit 1
      - cmd: |
          deadline=$(( $(date +%s) + 300 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if curl -fsS -o /dev/null --max-time 10 '{{.FOUNDRY_URL}}/' 2>/dev/null; then
              echo 'Foundry is up at {{.FOUNDRY_URL}}'
              exit 0
            fi
            sleep 5
          done
          echo 'The host is running, but Foundry did not answer within 5 minutes' >&2
          exit 1
        silent: true

  host:stop:
    desc: Shut Foundry down with /foundry/stop_foundry.sh, then stop the host
    summary: |
      Shut Foundry down safely, then stop the host.

      Runs /foundry/stop_foundry.sh on the host through SSM Run Command, then
      stops foundry.service and checks that no Foundry process is left. If any
      of that fails, the host is left running. Make sure nobody is playing
      first: this disconnects everyone.

      This is End session. It takes no backup of its own; the next scheduled
      snapshot holds the finished session.
    vars: *host-vars
    preconditions: *one-host
    status:
      - test '{{.HOST_STATE}}' = stopped
    cmds:
      # A host still starting is waited out, then shut down like a running one.
      # A host already stopping (say, a retry after an interrupted stop) only
      # needs the wait.
      - cmd: |
          if [ '{{.HOST_STATE}}' = pending ]; then
            aws ec2 wait instance-running --region {{.AWS_REGION}} --instance-ids {{.INSTANCE_ID}} || exit 1
          fi
        if: test '{{.HOST_STATE}}' != stopping
      - task: host:shutdown-foundry
        if: test '{{.HOST_STATE}}' != stopping
        vars:
          INSTANCE_ID: '{{.INSTANCE_ID}}'
          HOST_STATE: '{{if eq .HOST_STATE "pending"}}running{{else}}{{.HOST_STATE}}{{end}}'
      - cmd: aws ec2 stop-instances --region {{.AWS_REGION}} --instance-ids {{.INSTANCE_ID}} --output text
        if: test '{{.HOST_STATE}}' != stopping
      - aws ec2 wait instance-stopped --region {{.AWS_REGION}} --instance-ids {{.INSTANCE_ID}}
      - echo 'Host {{.INSTANCE_ID}} is stopped'

  host:shutdown-foundry:
    internal: true
    requires:
      vars: [INSTANCE_ID, HOST_STATE]
    preconditions:
      - sh: test '{{.HOST_STATE}}' = running
        msg: 'Host {{.INSTANCE_ID}} is {{.HOST_STATE}}; Foundry can only be shut down while it is running'
    cmds:
      - cmd: |
          # A host that has just booted may not have registered with SSM yet,
          # which SendCommand reports as InvalidInstanceId. Retry that for up
          # to two minutes; fail at once on anything else.
          err=$(mktemp)
          trap 'rm -f "$err"' EXIT
          command_id=
          for i in $(seq 1 24); do
            if command_id=$(aws ssm send-command --region {{.AWS_REGION}} \
              --instance-ids {{.INSTANCE_ID}} --document-name foundry-shutdown \
              --document-version '$LATEST' \
              --comment 'Shut down Foundry before stopping the host' \
              --query Command.CommandId --output text 2>"$err"); then
              break
            fi
            command_id=
            grep -q InvalidInstanceId "$err" || break
            sleep 5
          done
          if [ -z "$command_id" ]; then
            cat "$err" >&2
            echo 'Could not send the Foundry shutdown; the host is still running' >&2
            exit 1
          fi
          echo "Shutting down Foundry (command $command_id)"
          status=Pending
          for i in $(seq 1 80); do
            sleep 5
            status=$(aws ssm get-command-invocation --region {{.AWS_REGION}} \
              --instance-id {{.INSTANCE_ID}} --command-id "$command_id" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending | InProgress | Delayed) ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --region {{.AWS_REGION}} \
            --instance-id {{.INSTANCE_ID}} --command-id "$command_id" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          if [ "$status" != Success ]; then
            echo "Foundry shutdown ended with status $status; the host is still running" >&2
            exit 1
          fi
        silent: true
