name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check AWS feature review completeness
        run: |
          python3 scripts/check_feature_review.py
          python3 -m unittest discover -s tests -p test_feature_review.py -v
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download and verify modules
        run: |
          go mod download
          go mod verify
      - name: Check code and Lambda artifact
        run: make ci
      - name: Verify module manifests are unchanged
        run: git diff --exit-code -- go.mod go.sum
