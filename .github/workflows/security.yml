name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history and working files
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --log-opts='--full-history -m HEAD' .
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --no-banner .

  workflows:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install workflow scanners
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workflow-scanners"
          cd "$RUNNER_TEMP/workflow-scanners"
          curl --fail --silent --show-error --location --retry 3 \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          curl --fail --silent --show-error --location --retry 3 \
            --output zizmor.tar.gz \
            https://github.com/zizmorcore/zizmor/releases/download/v1.30.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo 'ec8c95cd800845abb9bbc5f377ec7c57d2eb8e2386a00a201d3a74ee4092e5ed  zizmor.tar.gz' | sha256sum --check --strict
          tar -xzf zizmor.tar.gz zizmor
      - name: Validate workflow syntax
        run: '"$RUNNER_TEMP/workflow-scanners/actionlint" -color'
      - name: Audit workflow and Dependabot security
        run: '"$RUNNER_TEMP/workflow-scanners/zizmor" --offline --strict-collection --persona pedantic .github'
